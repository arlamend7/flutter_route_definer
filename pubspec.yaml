name: route_definer
description: Typed Flutter Router navigation with URI patterns, explicit guards, browser history, restoration, and custom route factories.
version: 3.0.0
homepage: https://github.com/arlamend7/flutter_route_definer
repository: https://github.com/arlamend7/flutter_route_definer
issue_tracker: https://github.com/arlamend7/flutter_route_definer/issues
documentation: https://arlamend7.github.io/flutter_route_definer
license: MIT
example: example/lib/main.dart

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  web: ">=0.4.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
