name: Validate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.27.0', '3.32.8', '3.41.6', '3.47.5']
        dependencies: [get, downgrade]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub ${{ matrix.dependencies }}
      - run: flutter pub ${{ matrix.dependencies }}
        working-directory: example
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub
        working-directory: example
      - if: matrix.flutter == '3.41.6' && matrix.dependencies == 'get'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test tool

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.27.0', '3.47.5']
        dependencies: [get, downgrade]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub ${{ matrix.dependencies }}
      - run: flutter pub ${{ matrix.dependencies }}
        working-directory: example
      - name: Build runnable example
        run: flutter build web --release --no-pub --no-web-resources-cdn
        working-directory: example
      - name: JavaScript browser regression app
        run: flutter build web --release --no-pub --no-web-resources-cdn -t lib/browser_check.dart
        working-directory: example
      - run: node tool/browser_check.mjs example/build/web js
      - name: WebAssembly browser regression app
        run: flutter build web --release --wasm --no-pub --no-web-resources-cdn -t lib/browser_check.dart
        working-directory: example
      - run: node tool/browser_check.mjs example/build/web wasm

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart doc --output build/api
      - run: dart pub publish --dry-run
      - name: Version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/check_release.py
